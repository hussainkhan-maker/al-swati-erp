<!doctype html>
<html><head><meta charset="utf-8">
<!-- Drawn backgrounds of the automatic videos ("scene" shots): every part is drawn from its real measurements, in code, so an
     angle, a kerf or a stone can never end up in the wrong place (pictures made by an image model did). render.py calls
     setupScenes(shots) once, then drawScene(j, t) for every frame and uses the screenshot as that shot's background; the
     text layer (text.html) goes on top, so the upper third of every scene stays calm.
     A scene shot's background in the plan:  {"kind":"scene","scene":"<name>", ...parameters}   one of SCENES below, or
                                            {"kind":"scene","code":"<JavaScript>"}             own drawing, see CODE below.
     Everything is a function of the time t (seconds from the start of the shot): no timers, no random numbers at draw time.

     SCENES (parameters in brackets; stone = limestone | white | travertine | marble | granite | porcelain):
       updown   {stage: wall | anchor | angle | upper | gap, stone}   side section of the Up-Down angle fixing, step by step
       pen      {stage: bracket | pin | upper | gap, stone}           PEN (pin) fixing in section
       cchannel {stage: bracket | channel | angle | upper | gap, stone}  vertical C-Channel in section
       kerfrail {stage: front | section | upper | gap, stone}         kerf rail: front (one long rail per row), then its section
       undercut {stage: drill | anchor | hang | face, stone}          undercut anchors in the back of the panel, on a rail
       facade   {stone, cols, rows}                                    front view: panels set row by row on their angles
       villa    {stone, frame: dark | bronze | light}                  a finished modern villa front
       compare  {stones:[a,b(,c)], labels:[..]}                        the same villa, the stone changes with a wipe
       swatches {stones:[..], labels:[..]}                             2 to 4 stone samples side by side
       checklist{items:[..], bad:[indexes that get a cross]}           a list that ticks itself
       bars     {items:[{label, value, note}], unit}                   bars that grow to their values

     CODE: the text of a function body that returns SVG markup for one frame. It gets (K, t, dur, W, H) and draws on a
     1080 x 1920 canvas; K is the kit below (easings, textures, the section parts with their real measurements, labels).
       return K.sky("dusk") + K.mm(540, 1250, 5.6, K.wall() + K.stone(-460, 0, {kerfBottom: true})) + K.tag(540, 1700, "30 mm", K.pop(t, .4));
-->
<style>
@font-face{font-family:Tajawal;font-weight:500;src:url(fonts/Tajawal-Medium.ttf)}
@font-face{font-family:Tajawal;font-weight:700;src:url(fonts/Tajawal-Bold.ttf)}
@font-face{font-family:Tajawal;font-weight:800;src:url(fonts/Tajawal-ExtraBold.ttf)}
@font-face{font-family:Tajawal;font-weight:900;src:url(fonts/Tajawal-Black.ttf)}
@font-face{font-family:Mont;font-weight:100 900;src:url(fonts/Montserrat.ttf)}
*{margin:0;padding:0}html,body{width:1080px;height:1920px;overflow:hidden;background:#0c1220}
svg{position:absolute;inset:0}
text{font-family:Tajawal,Mont,sans-serif}
</style></head>
<body><svg id="s" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs id="defs"></defs><g id="g"></g></svg>
<script>
const W = 1080, H = 1920;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const f1 = x => (+x).toFixed(1), f2 = x => (+x).toFixed(2);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- the kit ---------- */
const K = {
  W, H, clamp, lerp,
  /** progress 0..1 of a move that starts at a and lasts d seconds */
  P: (t, a, d) => clamp((t - a) / d),
  out: k => 1 - Math.pow(1 - k, 3), inn: k => k * k * k, io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  /** falls and bounces to rest (a part landing on its seat) */
  bounce(k) { const n = 7.5625, d = 2.75; if (k < 1 / d) return n * k * k; if (k < 2 / d) return n * (k -= 1.5 / d) * k + .75; if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + .9375; return n * (k -= 2.625 / d) * k + .984375; },
  /** a heavy part coming to rest on its seat: it falls, then one tiny rebound */
  land(k) { k = clamp(k); if (k < .72) return Math.pow(k / .72, 2); const q = (k - .72) / .28; return 1 - .03 * Math.abs(Math.sin(q * Math.PI * 2)) * (1 - q); },
  /** overshoots a little and settles (a label or a tick popping in) */
  back: k => 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2),
  /** 0..1 pop used for labels: K.pop(t, start) */
  pop: (t, a, d = .45) => K.back(clamp((t - a) / d)),
  /** a slow breathing value between -1 and 1 */
  wave: (t, hz = .5, ph = 0) => Math.sin((t * hz + ph) * Math.PI * 2),

  /* colours */
  C: { navy: "#0c1220", navy2: "#16213a", gold: "#e9c27d", gold2: "#c9a74a", steel: "#c9d1da", steel2: "#8f9aa6", steelDark: "#5d6772", concrete: "#8d9096", concrete2: "#6f7278",
       green: "#7fe0a0", red: "#e2533e", white: "#ffffff", ink: "#0a0e18" },
  STONES: { limestone: ["#d9c39a", "حجر الرياض", "Riyadh limestone"], white: ["#ece4d2", "حجر الرياض الأبيض", "White Riyadh stone"], travertine: ["#cdb48c", "ترافرتين", "Travertine"],
            marble: ["#eeeeec", "رخام", "Marble"], granite: ["#7d7f84", "جرانيت", "Granite"], porcelain: ["#b9bcc0", "بورسلان", "Porcelain"] },
  FRAMES: { dark: "#1c2026", bronze: "#5a4630", light: "#d9dcdf" },
  stoneOf: s => K.STONES[s] ? s : "limestone",
  /** fill of a stone: its texture */
  tex: s => `url(#tx-${K.stoneOf(s)})`,

  /* backdrops */
  sky(kind = "studio") {
    if (kind === "dusk") return `<rect width="${W}" height="${H}" fill="url(#g-dusk)"/>`;
    if (kind === "day") return `<rect width="${W}" height="${H}" fill="url(#g-day)"/>`;
    return `<rect width="${W}" height="${H}" fill="url(#g-studio)"/><rect width="${W}" height="${H}" fill="url(#g-vig)"/>`;
  },
  floor: (y = 1640, a = .5) => `<rect x="0" y="${y}" width="${W}" height="${H - y}" fill="url(#g-floor)" opacity="${a}"/>`,
  /** content drawn in millimetres: (cx, cy) on the canvas is the point (0, 0) of the drawing, u = pixels per millimetre */
  mm: (cx, cy, u, inner) => `<g transform="translate(${f1(cx)} ${f1(cy)}) scale(${f2(u)})">${inner}</g>`,
  at: (x, y, inner, extra = "") => `<g transform="translate(${f1(x)} ${f1(y)}) ${extra}">${inner}</g>`,
  fade: (a, inner) => a >= 1 ? inner : a <= 0 ? "" : `<g opacity="${f2(a)}">${inner}</g>`,

  /* ----- the side section of a mechanically fixed facade, in millimetres -----
     x: 0 is the face of the wall, the stone is on the right. y: 0 is the top of the angle's blade (the seat of the upper
     stone), up is negative. Measurements: air gap 40, stone 30 thick, kerf 4 wide and 15 deep in the middle of the edge,
     angle 3 thick with a 55 leg on the wall (slotted hole for the anchor), joint 8 (blade 3 + 5 clear, so the blade never rests on the stone below). */
  D: { gap: 40, stone: 30, kerfW: 4, kerfD: 15, th: 3, leg: 55, tongue: 12, joint: 8, anchorY: -28, anchorIn: 70 },
  wall(y0 = -900, y1 = 900) {
    return `<rect x="-260" y="${y0}" width="260" height="${y1 - y0}" fill="url(#txm-concrete)"/><rect x="-260" y="${y0}" width="260" height="${y1 - y0}" fill="url(#g-wallshade)"/>
      <rect x="-1.2" y="${y0}" width="1.2" height="${y1 - y0}" fill="#4d5056"/>`;
  },
  /** the hole drilled for the anchor; k = how far it is drilled (0..1) */
  hole(k = 1, y = K.D.anchorY) { const d = K.D.anchorIn * clamp(k); return d <= 0 ? "" : `<rect x="${f1(-d)}" y="${y - 5}" width="${f1(d)}" height="10" fill="#23262b"/>`; },
  /** the anchor bolt; out = millimetres it still stands out of its final seat (0 = home); turn = radians of the nut */
  anchor(out = 0, turn = 0, y = K.D.anchorY, nut = true) {
    const x = out, th = K.D.th;
    let s = `<g transform="translate(${f1(x)} ${y})"><rect x="${-K.D.anchorIn}" y="-3.6" width="${K.D.anchorIn + th + 11}" height="7.2" rx="1.2" fill="url(#g-bolt)"/>`;
    for (let i = 0; i < 9; i++) s += `<rect x="${-K.D.anchorIn + 4 + i * 3.2}" y="-3.6" width="1" height="7.2" fill="#5d6772" opacity=".55"/>`;   // the expansion sleeve's grooves
    for (let i = 0; i < 4; i++) s += `<rect x="${th + 1.5 + i * 2.4}" y="-3.6" width=".8" height="7.2" fill="#5d6772" opacity=".7"/>`;                 // thread
    if (nut) { const w = 9 + 1.6 * Math.abs(Math.cos(turn * 3));   // a hexagon seen from the side changes width as it turns
      s += `<rect x="${th}" y="-9" width="1.6" height="18" rx=".5" fill="${K.C.steel2}"/><rect x="${th + 1.6}" y="${f1(-w / 2 - 2)}" width="6.5" height="${f1(w + 4)}" rx="1" fill="url(#g-steelV)" stroke="#4d5661" stroke-width=".4"/>
        <rect x="${th + 1.6}" y="${f1(-1 + 2.2 * Math.sin(turn * 3))}" width="6.5" height=".7" fill="#4d5661" opacity=".6"/>`; }
    return s + `</g>`;
  },
  /** the Up-Down angle: a leg on the wall, a blade out to the middle of the stone, one tongue up and one tongue down */
  angle(dx = 0, dy = 0, glow = 0) {
    const d = K.D, kx = d.gap + d.stone / 2, th = d.th;
    const p = `M0 ${-d.leg} h${th} v${d.leg - 0} h${kx - th - th / 2} v${-d.tongue} h${th} v${d.tongue + th + d.tongue} h${-th} v${-d.tongue} H0 Z`;
    return `<g transform="translate(${f1(dx)} ${f1(dy)})">${glow > 0 ? `<path d="${p}" fill="none" stroke="${K.C.gold}" stroke-width="${f1(3 * glow)}" opacity="${f2(.55 * glow)}" filter="url(#f-glow)"/>` : ""}
      <path d="${p}" fill="url(#g-steel)" stroke="#49525c" stroke-width=".5" stroke-linejoin="round"/>
      <path d="M.8 ${-d.leg + 1} V-.2" stroke="#fff" stroke-width=".5" opacity=".55"/><path d="M${th} .7 H${kx - th}" stroke="#fff" stroke-width=".45" opacity=".5"/>
      <rect x="-.2" y="${d.anchorY - 4.5}" width="${th + .4}" height="${9 + d.tongue + 4}" rx="1" fill="#2a2f36" opacity=".85"/></g>`;
  },
  /** a stone panel in section. y = its bottom edge when it sits (top = y - h). kerfTop / kerfBottom cut the grooves. */
  stone(top, bottom, o = {}) {
    const d = K.D, x = d.gap, kw = o.slotW || d.kerfW, kd = o.slotD || d.kerfD, kx = d.gap + d.stone / 2 - kw / 2, s = K.stoneOf(o.stone);
    let m = `<rect x="${x}" y="${top}" width="${d.stone}" height="${bottom - top}" fill="url(#txm-${s})"/><rect x="${x}" y="${top}" width="${d.stone}" height="${bottom - top}" fill="url(#g-stoneshade)"/>
      <rect x="${x + d.stone - 1.4}" y="${top}" width="1.4" height="${bottom - top}" fill="#fff" opacity=".35"/>`;
    if (o.kerfTop) m += `<rect x="${kx}" y="${top - .3}" width="${kw}" height="${kd + .3}" fill="#1b1e24"/>`;
    if (o.kerfBottom) m += `<rect x="${kx}" y="${bottom - kd}" width="${kw}" height="${kd + .3}" fill="#1b1e24"/>`;
    return `<g transform="translate(${f1(o.dx || 0)} ${f1(o.dy || 0)}) ${o.rot ? `rotate(${f2(o.rot)} ${x + d.stone / 2} ${bottom})` : ""}">${m}<rect x="${x}" y="${top}" width="${d.stone}" height="${bottom - top}" fill="none" stroke="#5b5346" stroke-width=".45"/></g>`;
  },
  /** steel drawn as a closed path (mm), with the same finish as the angle */
  steel: (d, glow = 0) => (glow > 0 ? `<path d="${d}" fill="none" stroke="${K.C.gold}" stroke-width="${f1(3 * glow)}" opacity="${f2(.55 * glow)}" filter="url(#f-glow)"/>` : "") + `<path d="${d}" fill="url(#g-steel)" stroke="#49525c" stroke-width=".5" stroke-linejoin="round"/>`,
  /** PEN fixing: the bracket (a leg on the wall and a flat blade with a hole for the pin, no tongues) */
  bracket(dx = 0, dy = 0, glow = 0) { const d = K.D, e = d.gap + d.stone / 2 + 9;
    return `<g transform="translate(${f1(dx)} ${f1(dy)})">` + K.steel(`M0 ${-d.leg} h${d.th} v${d.leg} H${e} v${d.th} H0 Z`, glow) + `<rect x="${d.gap + d.stone / 2 - 3}" y="-.3" width="6" height="${d.th + .6}" fill="#23262b"/><rect x="-.2" y="${d.anchorY - 4.5}" width="${d.th + .4}" height="9" rx="1" fill="#2a2f36" opacity=".85"/></g>`; },
  /** PEN fixing: the round pin, 50 long: half in the stone above, half in the stone below */
  pin: (dy = 0) => `<rect x="${K.D.gap + K.D.stone / 2 - 2.5}" y="${f1(-25 + dy)}" width="5" height="50" rx="2" fill="url(#g-bolt)" stroke="#49525c" stroke-width=".4"/>`,
  /** a short bolt with its head on the right (through an angle into a channel or a rail) */
  bolt: (x, y, len = 16, a = 1) => `<g opacity="${f2(a)}"><rect x="${x - len}" y="${y - 3}" width="${len + 3}" height="6" rx="1" fill="url(#g-bolt)"/><rect x="${x + 3}" y="${y - 6.5}" width="6" height="13" rx="1" fill="url(#g-steelV)" stroke="#4d5661" stroke-width=".4"/></g>`,
  /** C-Channel: the vertical channel in section (40 deep), standing 50 off the wall on its brackets */
  channel(dy = 0, y0 = -900, y1 = 900) { return `<g transform="translate(0 ${f1(dy)})"><rect x="50" y="${y0}" width="40" height="${y1 - y0}" fill="url(#g-steel)" stroke="#49525c" stroke-width=".5"/><rect x="54" y="${y0}" width="32" height="${y1 - y0}" fill="#39414b" opacity=".55"/><rect x="50" y="${y0}" width="1.2" height="${y1 - y0}" fill="#fff" opacity=".5"/></g>`; },
  /** C-Channel: a wall bracket (a leg on the wall, an arm out to the channel) at height y */
  wallBracket(y = 45, dx = 0, glow = 0) { return `<g transform="translate(${f1(dx)} ${y})">` + K.steel("M0 -30 h4 v28 h54 v4 h-54 v28 h-4 Z", glow) + `</g>`; },
  /** Undercut: the hole in the BACK of the panel (back face at x = gap), k = drilled depth 0..1, w = how far its base is widened 0..1 */
  ucHole(y, k = 1, w = 1) { const x = K.D.gap, dp = 16 * clamp(k), e = 2.6 * clamp(w); return dp <= 0 ? "" : `<path d="M${x - .3} ${y - 3.5} H${f1(x + dp - 5)} L${f1(x + dp)} ${f1(y - 3.5 - e)} V${f1(y + 3.5 + e)} L${f1(x + dp - 5)} ${y + 3.5} H${x - .3} Z" fill="#1b1e24"/>`; },
  /** Undercut: the anchor in its hole (out = mm still outside, open = how far its sleeve has spread 0..1) and the hanger that hooks on the rail */
  ucAnchor(y, out = 0, open = 1) { const x = K.D.gap - out, e = 2.4 * clamp(open); return `<path d="M${x + 11} ${y - 3.2} L${x + 16} ${f1(y - 3.2 - e)} V${f1(y + 3.2 + e)} L${x + 11} ${y + 3.2} Z" fill="#aab4be" stroke="#49525c" stroke-width=".4"/><rect x="${x - 12}" y="${y - 2.4}" width="24" height="4.8" rx="1" fill="url(#g-bolt)"/>`; },
  hanger(y, a = 1) { const x = K.D.gap; return K.fade(a, K.steel(`M${x} ${y - 9} h-4 v-7 h-22 v14 h3 v-10 h15 v20 h8 Z`) + `<rect x="${x - 10.5}" y="${y - 5}" width="5" height="10" rx="1" fill="url(#g-steelV)" stroke="#4d5661" stroke-width=".4"/>`); },
  /** Undercut: the horizontal rail on the wall that the hangers hook over (its lip stands up at x 19..22, top at y) */
  ucRail(y) { return K.steel(`M0 ${y - 18} h4 v26 h18 v-20 h-3 v17 h-15 v25 h-4 Z`) + `<rect x="-.2" y="${y + 14}" width="4.4" height="7" fill="#2a2f36" opacity=".8"/>`; },
  /** arrows of air rising in the gap behind the stone */
  air(t, a = 1, y0 = -420, y1 = 420) {
    let s = ""; const x = K.D.gap / 2;
    for (let i = 0; i < 7; i++) { const k = ((t * .28 + i / 7) % 1), y = lerp(y1, y0, k), o = Math.sin(k * Math.PI) * a;
      s += `<g transform="translate(${x + 5 * Math.sin((k * 3 + i) * 2)} ${f1(y)})" opacity="${f2(o)}"><path d="M0 16 V-10 M-6 -3 L0 -11 L6 -3" fill="none" stroke="#8fd3ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>`; }
    return s;
  },
  /** a measurement line with its value, drawn in the units of the group it is put in (px or mm); k = how far it has grown */
  dim(x1, y1, x2, y2, label, k = 1, o = {}) {
    k = clamp(k); if (k <= 0) return "";
    const sw = o.sw || 3, fs = o.fs || 44, cx = (x1 + x2) / 2, cy = (y1 + y2) / 2, ax = lerp(cx, x1, k), ay = lerp(cy, y1, k), bx = lerp(cx, x2, k), by = lerp(cy, y2, k);
    const horiz = Math.abs(x2 - x1) > Math.abs(y2 - y1), tk = sw * 3.2;
    const ticks = horiz ? `M${f1(ax)} ${f1(ay - tk)} V${f1(ay + tk)} M${f1(bx)} ${f1(by - tk)} V${f1(by + tk)}` : `M${f1(ax - tk)} ${f1(ay)} H${f1(ax + tk)} M${f1(bx - tk)} ${f1(by)} H${f1(bx + tk)}`;
    const lx = horiz ? cx : cx + (o.side || 1) * fs * 1.5, ly = horiz ? cy + (o.side || -1) * fs * .9 : cy + fs * .35;
    return `<path d="M${f1(ax)} ${f1(ay)} L${f1(bx)} ${f1(by)} ${ticks}" stroke="${K.C.gold}" stroke-width="${sw}" stroke-linecap="round" fill="none"/>
      <text x="${f1(lx)}" y="${f1(ly)}" font-size="${fs}" font-weight="800" fill="${K.C.gold}" text-anchor="middle" font-family="Mont" opacity="${f2(clamp(k * 2 - 1))}" paint-order="stroke" stroke="${K.C.ink}" stroke-width="${fs * .16}">${esc(label)}</text>`;
  },
  /** a pill label on the canvas (px); k = its pop (use K.pop). ar = true for Arabic text. */
  tag(x, y, text, k = 1, o = {}) {
    if (k <= 0) return ""; const fs = o.fs || 46, w = o.w || Math.max(150, String(text).length * fs * (o.ar ? .52 : .6) + 56), h = fs * 1.55, col = o.color || K.C.gold;
    return `<g transform="translate(${f1(x)} ${f1(y)}) scale(${f2(k)})" opacity="${f2(clamp(k * 1.5))}"><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${K.C.ink}" fill-opacity=".82" stroke="${col}" stroke-width="3"/>
      <text x="0" y="${fs * .34}" font-size="${fs}" font-weight="800" fill="${col}" text-anchor="middle" ${o.ar ? 'direction="rtl" font-family="Tajawal"' : 'font-family="Mont"'}>${esc(text)}</text></g>`;
  },
  /** a thin leader line from a label to the part it names (px) */
  lead: (x1, y1, x2, y2, k = 1) => k <= 0 ? "" : `<path d="M${f1(x1)} ${f1(y1)} L${f1(lerp(x1, x2, clamp(k)))} ${f1(lerp(y1, y2, clamp(k)))}" stroke="${K.C.gold}" stroke-width="3" stroke-linecap="round" opacity=".9"/><circle cx="${f1(x2)}" cy="${f1(y2)}" r="${f1(7 * clamp(k * 2 - 1))}" fill="${K.C.gold}"/>`,
  /** a green tick or a red cross that draws itself; k = 0..1 */
  tick(x, y, k, r = 34) { k = clamp(k); return k <= 0 ? "" : `<g transform="translate(${x} ${y})"><circle r="${r}" fill="${K.C.green}" opacity="${f2(.18 * k)}"/><path d="M${-r * .45} 0 L${-r * .1} ${r * .36} L${r * .5} ${-r * .38}" fill="none" stroke="${K.C.green}" stroke-width="${r * .2}" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${f2(1 - k)}"/></g>`; },
  cross(x, y, k, r = 34) { k = clamp(k); return k <= 0 ? "" : `<g transform="translate(${x} ${y})"><circle r="${r}" fill="${K.C.red}" opacity="${f2(.18 * k)}"/><path d="M${-r * .38} ${-r * .38} L${r * .38} ${r * .38} M${r * .38} ${-r * .38} L${-r * .38} ${r * .38}" fill="none" stroke="${K.C.red}" stroke-width="${r * .2}" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${f2(1 - k)}"/></g>`; },
  /** small dust puff where a part lands; k = 0..1 since the landing */
  puff(x, y, k, n = 8, r = 60) { if (k <= 0 || k >= 1) return ""; let s = ""; for (let i = 0; i < n; i++) { const a = Math.PI * (1 + (i + .5) / n), d = r * K.out(k); s += `<circle cx="${f1(x + Math.cos(a) * d * 1.5)}" cy="${f1(y + Math.sin(a) * d * .45)}" r="${f1(9 * (1 - k) + 2)}" fill="#e8dcc6" opacity="${f2(.5 * (1 - k))}"/>`; } return s; },
  text(x, y, s, o = {}) { return `<text x="${f1(x)}" y="${f1(y)}" font-size="${o.fs || 48}" font-weight="${o.w || 800}" fill="${o.color || "#fff"}" text-anchor="${o.anchor || "middle"}" opacity="${f2(o.a ?? 1)}" ${o.ar ? 'direction="rtl" font-family="Tajawal"' : 'font-family="Mont"'} paint-order="stroke" stroke="${K.C.ink}" stroke-width="${(o.fs || 48) * .12}" stroke-opacity=".7">${esc(s)}</text>`; },

  /* ----- front views (px) ----- */
  /** a modern villa front, drawn inside the box (x, y, w, h); the facade panels take the stone, frames take the frame colour */
  villa(x, y, w, h, o = {}) {
    const s = K.stoneOf(o.stone), fr = K.FRAMES[o.frame] || K.FRAMES.dark, glass = o.night ? "url(#g-glassNight)" : "url(#g-glass)", u = w / 100, v = h / 100;
    const R = (a, b, c, d, fill, extra = "") => `<rect x="${f1(x + a * u)}" y="${f1(y + b * v)}" width="${f1(c * u)}" height="${f1(d * v)}" fill="${fill}" ${extra}/>`;
    const grid = (a, b, c, d, cols, rows) => { let g = ""; for (let i = 1; i < cols; i++) g += `<path d="M${f1(x + (a + c * i / cols) * u)} ${f1(y + b * v)} v${f1(d * v)}"/>`; for (let j = 1; j < rows; j++) g += `<path d="M${f1(x + a * u)} ${f1(y + (b + d * j / rows) * v)} h${f1(c * u)}"/>`; return `<g stroke="#3d382f" stroke-width="2" opacity=".5">${g}</g>`; };

      else m += front(K.angle()) + K.bolt(off + d.th, d.anchorY, 16); }
    if (n >= 3) { const k = st === "upper" ? K.P(t, .5, 1.3) : 1; m += front(K.stone(-900, 0, { stone, kerfBottom: true, dy: lerp(-460, 0, K.land(k)) }));
      if (st === "upper") over += K.puff(sx(off + 55), cy, K.P(t, .5 + 1.3 * .72, .6)) + K.tick(sx(off + 82), cy - 60, K.out(K.P(t, 2.0, .45)), 40); }
    if (st === "gap") over += K.tag(300, cy - 330, "الجدار ضعيف؟", K.pop(t, .8), { ar: true, fs: 40 }) + K.tag(760, cy - 240, "المجرى هو اللي يشيل", K.pop(t, 1.5), { ar: true, fs: 40, color: K.C.green }) + K.lead(700, cy - 202, sx(72), cy - 100, K.P(t, 1.6, .35));
    const push = 1 + .03 * K.io(K.P(t, 0, dur));
    return K.sky("studio") + `<g transform="translate(${cx} ${cy}) scale(${f2(push)}) translate(${-cx} ${-cy})">` + K.mm(cx, cy, u, m) + over + `</g>`;
  },

  /* Kerf rail. Stage front: one long rail goes onto the row below, then the next row comes down onto it. Stages section | gap: its section (the same shape as the angle, but continuous). */
  kerfrail(K, t, dur, p) {
    if (p.stage === "section") return SCENES.updown(K, t, dur, { stage: "angle", stone: p.stone, name: "مجرى Kerf أفقي" });
    if (p.stage === "upper" || p.stage === "gap") return SCENES.updown(K, t, dur, { stage: p.stage, stone: p.stone });
    const stone = K.stoneOf(p.stone), cols = 3, j = 9, x0 = 90, wAll = W - 180, pw = (wAll - j * (cols - 1)) / cols, ph = 250, yJ = 1330;
    let s = K.sky("studio") + `<rect x="${x0 - 24}" y="880" width="${wAll + 48}" height="760" fill="url(#tx-concrete)"/><rect x="${x0 - 24}" y="880" width="${wAll + 48}" height="760" fill="#0a0e18" opacity=".35"/>`;
    const panel = (x, y) => `<g transform="translate(${f1(x)} ${f1(y)})"><rect width="${f1(pw)}" height="${ph}" fill="${K.tex(stone)}"/><rect width="${f1(pw)}" height="${ph}" fill="url(#g-facadeshade)"/><rect width="${f1(pw)}" height="3" fill="#fff" opacity=".25"/></g>`;
    for (let c = 0; c < cols; c++) s += panel(x0 + c * (pw + j), yJ + j);
    const r = K.out(K.P(t, .4, 1.1)), rw = wAll + 20;   // the rail slides in along the top edge of the row
    s += `<g transform="translate(${f1(lerp(-rw - 60, x0 - 10, r))} ${yJ - 22})"><rect width="${rw}" height="34" rx="3" fill="url(#g-steelV)" stroke="#49525c" stroke-width="1.5"/><rect y="3" width="${rw}" height="3" fill="#fff" opacity=".5"/></g>`;
    for (let i = 0; i < 5; i++) { const a = K.pop(t, 1.6 + i * .12, .3); if (a > 0) s += `<g transform="translate(${f1(x0 + 60 + i * (wAll - 120) / 4)} ${yJ - 5}) scale(${f2(a)})"><circle r="11" fill="#59626c" stroke="#2c3138" stroke-width="2"/><path d="M-6 0 H6" stroke="#c9d1da" stroke-width="2.5"/></g>`; }
    for (let c = 0; c < cols; c++) { const k = K.P(t, 2.5 + c * .3, .7); if (k > 0) s += panel(x0 + c * (pw + j), lerp(yJ - ph - 420, yJ - ph, K.land(k))); }
    return s + K.tag(540, 1560, "مجرى واحد على طول الصف", K.pop(t, 1.9), { ar: true, fs: 42 });
  },

  /* Undercut anchors. Stages: drill (the hole in the back of the panel) | anchor (anchor and hanger) | hang (the panel hooks onto the rail) | face (the finished face: one panel comes off alone). */
  undercut(K, t, dur, p) {
    const d = K.D, st = p.stage || "hang", stone = p.stone;
    if (st === "face") {
      const cols = 3, rows = 3, j = 10, x0 = 110, wAll = W - 220, pw = (wAll - j * (cols - 1)) / cols, ph = 175, y0 = 900, lift = K.io(K.P(t, 1.0, .7)) * (1 - K.io(K.P(t, 2.8, .7)));
      let s = K.sky("studio") + `<rect x="${x0 - 20}" y="${y0 - 20}" width="${wAll + 40}" height="${rows * (ph + j) + 30}" fill="#0a0e18" opacity=".6"/>`, top = "";
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const me = r === 1 && c === 1, x = x0 + c * (pw + j), y = y0 + r * (ph + j);
        const g = `<g transform="translate(${f1(x + pw / 2)} ${f1(y + ph / 2 - (me ? 26 * lift : 0))}) scale(${f2(me ? 1 + .12 * lift : 1)})" ${me && lift > 0 ? 'filter="url(#f-shadow)"' : ""}><rect x="${f1(-pw / 2)}" y="${-ph / 2}" width="${f1(pw)}" height="${ph}" fill="${K.tex(K.stoneOf(stone))}"/><rect x="${f1(-pw / 2)}" y="${-ph / 2}" width="${f1(pw)}" height="${ph}" fill="url(#g-facadeshade)"/></g>`;
        if (me) top = g; else s += g; }
      return s + top + K.tag(540, 1610, "كل لوح ينفك لحاله", K.pop(t, 1.5), { ar: true, fs: 44 }) + K.tag(540, 1520, "ولا شي ظاهر على الوجه", K.pop(t, .5), { ar: true, fs: 40, color: K.C.green });
    }
    if (st === "drill" || st === "anchor") {   // the panel alone, close up: back face on the left
      const u = 15, cx = 60, cy = 1260, sx = x => cx + (x - d.gap + 14) * u; let m = "", over = "";
      const dk = st === "drill" ? K.io(K.P(t, .5, 1.1)) : 1, wk = st === "drill" ? K.io(K.P(t, 1.8, .9)) : 1;
      m += K.stone(-200, 200, { stone }) + K.ucHole(0, dk, wk);
      if (st === "drill") { const back = K.io(K.P(t, 2.9, .5)), bx = d.gap + 16 * dk - 300 * back - 60 * (1 - K.out(K.P(t, 0, .4))), wob = wk > 0 && wk < 1 ? 1.6 * Math.sin(t * 28) : 0;
        if (back < 1) m += `<g transform="translate(${f1(bx)} ${f1(wob)})"><rect x="-70" y="-3.2" width="70" height="6.4" rx="1" fill="#5b636d"/><rect x="-8" y="-4.6" width="8" height="9.2" rx="1" fill="#3a4049"/><rect x="-170" y="-16" width="100" height="32" rx="6" fill="#d9a441"/></g>`;
        over += K.tag(sx(d.gap) + 260, cy - 300, "ثقب من ظهر اللوح", K.pop(t, 1.2), { ar: true, fs: 42 }) + K.tag(sx(d.gap) + 300, cy + 300, "قاعدته أوسع", K.pop(t, 2.5), { ar: true, fs: 42 }) + K.lead(sx(d.gap) + 300, cy + 262, sx(d.gap + 15), cy + 60, K.P(t, 2.6, .35))
          + K.tag(sx(d.gap + 30) + 150, cy, "الوجه سليم", K.pop(t, 3.2), { ar: true, fs: 40, color: K.C.green });
      } else { const ins = K.out(K.P(t, .4, .8)), op = K.out(K.P(t, 1.4, .6)); m += K.ucAnchor(0, lerp(60, 0, ins), op) + K.hanger(0, K.P(t, 2.3, .3));
        over += K.tag(sx(d.gap) + 300, cy - 300, "مرساة Undercut", K.pop(t, .9), { ar: true, fs: 42 }) + K.tag(sx(d.gap) + 320, cy + 300, "تفتح وتقفل بشكلها", K.pop(t, 1.7), { ar: true, fs: 42 }) + K.lead(sx(d.gap) + 320, cy + 262, sx(d.gap + 14), cy + 50, K.P(t, 1.8, .35)) + K.tag(170, cy - 170, "مشبك التعليق", K.pop(t, 2.6), { ar: true, fs: 38 }); }
      return K.sky("studio") + K.mm(cx, cy, u, `<g transform="translate(${14 - d.gap} 0)">${m}</g>`) + over;
    }
    const u = 6.4, cx = 520, cy = 1290, a = K.io(K.P(t, .4, 1.0)), b = K.land(K.P(t, 1.5, .8));   // hang: across above the rail's lip, then down onto it
    const dx = lerp(120, 0, a), dy = -34 + 34 * b, yR = -12;
    // as built on site: the wall, a vertical profile standing on wall brackets, and the horizontal rails screwed to that profile
    const post = `<g transform="translate(-52 0)">` + K.wall() + K.wallBracket(60).replace("M0 -30 h4 v28 h54 v4 h-54 v28 h-4 Z", "M0 -30 h4 v28 h20 v4 h-20 v28 h-4 Z") + `<g transform="translate(0 ${75 - d.anchorY})">` + K.anchor(0, 0, d.anchorY, true) + `</g></g>`
      + `<rect x="-30" y="-900" width="30" height="1800" fill="url(#g-steel)" stroke="#49525c" stroke-width=".5"/><rect x="-26" y="-900" width="22" height="1800" fill="#39414b" opacity=".5"/>`;
    let m = post + K.ucRail(yR) + K.bolt(4, yR + 17, 9) + K.ucRail(yR + 330) + K.stone(d.joint + 4, 900, { stone });
    m += `<g transform="translate(${f1(dx)} ${f1(dy)})">` + K.stone(-330, 0, { stone }) + K.ucHole(-9, 1, 1) + K.ucAnchor(-9, 0, 1) + K.hanger(-9) + `</g>`;
    const over = K.puff(cx + 20 * u, cy - 80, K.P(t, 1.5 + .8 * .72, .5), 6, 40) + K.tag(790, cy - 330, "مجرى أفقي على قائم رأسي", K.pop(t, .8), { ar: true, fs: 40 }) + K.lead(780, cy - 292, cx + 14 * u, cy - 110, K.P(t, .9, .35))
      + K.tag(760, cy + 250, "اللوح يتعلق من ظهره", K.pop(t, 2.5), { ar: true, fs: 38 }) + K.tick(cx + 76 * u, cy - 60, K.out(K.P(t, 2.4, .45)), 40);
    return K.sky("studio") + K.mm(cx, cy, u, m) + over;
  },

  /* The facade from the front: rows of panels come down onto the angles of the row below, bottom row first. */
  facade(K, t, dur, p) {
    const cols = clamp(p.cols || 4, 2, 6), rows = clamp(p.rows || 5, 3, 7), stone = K.stoneOf(p.stone), j = 9;
    const x0 = 90, wAll = W - 180, pw = (wAll - j * (cols - 1)) / cols, ph = Math.min(190, 860 / rows), yBase = 1640;
    const per = Math.min(.5, (dur - 1.4) / rows);
    let s = K.sky("studio") + `<rect x="${x0 - 24}" y="${yBase - rows * (ph + j) - 30}" width="${wAll + 48}" height="${rows * (ph + j) + 40}" fill="url(#tx-concrete)" opacity=".9"/><rect x="${x0 - 24}" y="${yBase - rows * (ph + j) - 30}" width="${wAll + 48}" height="${rows * (ph + j) + 40}" fill="#0a0e18" opacity=".35"/>`;
    for (let r = 0; r < rows; r++) {
      const yRow = yBase - (r + 1) * ph - r * j, tRow = .4 + r * per;
      for (let c = 0; c < cols; c++) {   // the angles of this row: two per panel, on the top edge, set just before the next row comes
        const a = K.pop(t, tRow + per * .55 + c * .03, .3), xP = x0 + c * (pw + j);
        if (a > 0 && r < rows - 1) for (const f of [.25, .75]) s += `<g transform="translate(${f1(xP + pw * f)} ${f1(yRow - j / 2)}) scale(${f2(a)})"><rect x="-22" y="-26" width="44" height="30" rx="3" fill="url(#g-steel)" stroke="#49525c" stroke-width="1.5"/><circle cy="-12" r="6" fill="#59626c"/></g>`;
      }
    }
    for (let r = 0; r < rows; r++) {
      const yRow = yBase - (r + 1) * ph - r * j, tRow = .4 + r * per;
      for (let c = 0; c < cols; c++) {
        const k = K.P(t, tRow + c * .06, .55); if (k <= 0) continue;
        const y = lerp(-ph - 300, yRow, K.land(k)), xP = x0 + c * (pw + j);
        s += `<g transform="translate(${f1(xP)} ${f1(y)})" opacity="${f2(clamp(k * 4))}"><rect width="${f1(pw)}" height="${f1(ph)}" fill="${K.tex(stone)}"/><rect width="${f1(pw)}" height="${f1(ph)}" fill="url(#g-facadeshade)"/><rect x="0" y="0" width="${f1(pw)}" height="3" fill="#fff" opacity=".25"/></g>`;
      }
    }
    return s + K.floor(1640, .6);
  },

  /* The finished villa: dusk sky, a slow push-in. The brand card usually sits on this. */
  villa(K, t, dur, p) {
    const z = 1 + .06 * K.io(K.P(t, 0, dur)), night = p.sky !== "day";
    return K.sky(night ? "dusk" : "day") + `<g transform="translate(540 1330) scale(${f2(z)}) translate(-540 -1330)">` + K.villa(60, 800, 960, 840, { stone: p.stone, frame: p.frame, night }) + `</g>`
      + `<rect x="0" y="1640" width="${W}" height="280" fill="#15171c"/><rect x="0" y="1640" width="${W}" height="6" fill="#000" opacity=".4"/>`;
  },

  /* The same villa while the stone changes: a wipe from left to right for each stone, with its name. */
  compare(K, t, dur, p) {
    const stones = (p.stones || ["limestone", "marble"]).slice(0, 3).map(K.stoneOf), each = (dur - .6) / stones.length;
    let s = K.sky(p.sky === "dusk" ? "dusk" : "day");
    stones.forEach((st, i) => {
      const k = i === 0 ? 1 : K.io(K.P(t, .3 + i * each, .8)); if (k <= 0) return;
      s += `<clipPath id="cw${i}"><rect x="0" y="0" width="${f1(W * k)}" height="${H}"/></clipPath><g clip-path="url(#cw${i})">` + K.villa(60, 800, 960, 840, { stone: st, frame: p.frame, night: p.sky === "dusk" }) + `</g>`;
      if (k < 1) s += `<rect x="${f1(W * k - 4)}" y="840" width="8" height="820" fill="${K.C.gold}"/>`;
      const lab = (p.labels || [])[i] || K.STONES[st][1], a = K.pop(t, .5 + i * each + (i ? .6 : 0)) * (i < stones.length - 1 ? 1 - K.P(t, .3 + (i + 1) * each, .3) : 1);
      s += K.tag(540, 1760, lab, a, { ar: true, fs: 54 });
    });
    return s + `<rect x="0" y="1640" width="${W}" height="6" fill="#000" opacity=".35"/>`;
  },

  /* Stone samples side by side, each drops in and tilts to catch the light. */
  swatches(K, t, dur, p) {
    const stones = (p.stones || ["limestone", "white", "travertine"]).slice(0, 4).map(K.stoneOf), n = stones.length, w = n > 2 ? 420 : 520, h = n > 2 ? 420 : 560;
    const pos = n === 2 ? [[540, 1010], [540, 1620]] : n === 3 ? [[290, 1010], [790, 1010], [540, 1520]] : [[290, 1010], [790, 1010], [290, 1520], [790, 1520]];
    let s = K.sky("studio");
    stones.forEach((st, i) => {
      const k = K.P(t, .3 + i * .35, .7); if (k <= 0) return;
      const [cx, cy] = pos[i], y = lerp(-500, cy, K.bounce(k)), rot = 3 * (1 - K.out(k)) * (i % 2 ? 1 : -1) + .8 * K.wave(t, .2, i / n), sh = (K.wave(t, .25, i * .2) + 1) / 2;
      s += `<g transform="translate(${cx} ${f1(y)}) rotate(${f2(rot)})" filter="url(#f-shadow)"><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="10" fill="${K.tex(st)}"/><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="10" fill="#fff" opacity="${f2(.05 + .09 * sh)}"/><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="10" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/></g>`;
      s += K.tag(cx, cy + h / 2 - 50, (p.labels || [])[i] || K.STONES[st][1], K.pop(t, 1.0 + i * .35), { ar: true, fs: n > 2 ? 40 : 48 });
    });
    return s;
  },

  /* A list that ticks itself; indexes in "bad" get a red cross. */
  checklist(K, t, dur, p) {
    const items = (p.items || []).slice(0, 5), bad = p.bad || [], gap = Math.min(170, 760 / Math.max(1, items.length)), y0 = 1000, step = Math.min(.9, (dur - 1.2) / Math.max(1, items.length));
    let s = K.sky("studio");
    items.forEach((it, i) => {
      const a = K.out(K.P(t, .4 + i * step, .45)), y = y0 + i * gap; if (a <= 0) return;
      s += `<g opacity="${f2(a)}" transform="translate(${f1(60 * (1 - a))} 0)"><rect x="90" y="${y - 58}" width="900" height="${Math.min(130, gap - 24)}" rx="22" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
        <text x="880" y="${y + 22}" font-size="52" font-weight="800" fill="#fff" text-anchor="end" direction="rtl" font-family="Tajawal">${esc(it)}</text></g>`;
      s += bad.includes(i) ? K.cross(940, y + 6, K.out(K.P(t, .7 + i * step, .4)), 36) : K.tick(940, y + 6, K.out(K.P(t, .7 + i * step, .4)), 36);
    });
    return s;
  },

  /* Bars that grow to their values (a comparison in numbers). */
  bars(K, t, dur, p) {
    const items = (p.items || []).slice(0, 5), max = Math.max(1, ...items.map(i => +i.value || 0)), gap = Math.min(190, 800 / Math.max(1, items.length));
    let s = K.sky("studio");
    items.forEach((it, i) => {
      const k = K.out(K.P(t, .4 + i * .3, .9)), y = 1010 + i * gap, w = 780 * (+it.value || 0) / max * k;
      s += `<text x="990" y="${y - 22}" font-size="46" font-weight="800" fill="#fff" text-anchor="end" direction="rtl" font-family="Tajawal" opacity="${f2(clamp(k * 3))}">${esc(it.label)}</text>
        <rect x="90" y="${y}" width="900" height="54" rx="27" fill="#fff" fill-opacity=".08"/><rect x="${f1(990 - w - 60)}" y="${y}" width="${f1(w + 60)}" height="54" rx="27" fill="${it.color || K.C.gold}"/>
        <text x="${f1(990 - w - 78)}" y="${y + 40}" font-size="40" font-weight="800" fill="#fff" text-anchor="end" font-family="Mont" opacity="${f2(clamp(k * 2 - 1))}">${esc(Math.round((+it.value || 0) * k) + (p.unit ? " " + p.unit : ""))}</text>`;
    });
    return s;
  },
};

/* ---------- what render.py calls ---------- */
let LIST = [];
window.setupScenes = function (shots) {
  defs();
  LIST = shots.map(s => {
    const b = s.bg || {}; if (b.kind !== "scene") return null;
    if (b.code) { const fn = new Function("K", "t", "dur", "W", "H", b.code); return (t) => fn(K, t, s.dur, W, H); }
    const sc = SCENES[b.scene]; if (!sc) throw new Error("unknown scene: " + b.scene);
    return (t) => sc(K, t, s.dur, b);
  });
  LIST.forEach((fn, i) => { if (fn) { const out = fn(0); if (typeof out !== "string") throw new Error("scene " + i + " must return SVG text"); } });   // fail early, with the shot's number
  return LIST.map(Boolean);
};
window.drawScene = function (j, t) { document.getElementById("g").innerHTML = LIST[j](t); };
window.SCENE_NAMES = Object.keys(SCENES);
</script></body></html>
