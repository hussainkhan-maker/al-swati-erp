# Builds the laptop (browser) version of AL-Swati and puts it on GitHub Pages:
# https://hussainkhan-maker.github.io/al-swati-erp/
# GitHub Pages works for a private repository only on a paid GitHub plan (Pro). The code stays private; only the built site is served.
name: Laptop version (web)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: web
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - name: App icon
        run: pip install --quiet pillow && python3 scripts/make_icon.py
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Build the web version
        run: npx expo export --platform web --output-dir dist && cp dist/index.html dist/404.html && mkdir -p dist/blog && cp dist/index.html dist/blog/index.html
      - name: Keep the built site as a download
        uses: actions/upload-artifact@v6
        with: { name: AL-Swati-web, path: app/dist }
      # Publishing needs GitHub Pages: free for a public repository, or GitHub Pro for a private one.
      - uses: actions/configure-pages@v6
        continue-on-error: true
        id: pages
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outcome == 'success'
        with: { path: app/dist }
      # GitHub sometimes takes a while before it lists a new upload, and then deploy-pages
      # stops with "No artifacts named github-pages were found". Wait for the listing,
      # and if publishing still fails, wait a minute and try once more.
      - name: Wait until GitHub lists the site upload
        if: steps.pages.outcome == 'success'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for i in $(seq 1 36); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.total_count' 2>/dev/null || echo 0)
            if [ "${n:-0}" -ge 1 ]; then echo "GitHub lists the upload (after about $(( (i-1)*5 ))s)."; exit 0; fi
            sleep 5
          done
          echo "::warning::GitHub has not listed the github-pages upload after 3 minutes; trying to publish anyway."
      - uses: actions/deploy-pages@v5
        id: deploy
        if: steps.pages.outcome == 'success'
        continue-on-error: true
      - name: Wait a minute before trying again
        if: steps.pages.outcome == 'success' && steps.deploy.outcome == 'failure'
        run: sleep 60
      - uses: actions/deploy-pages@v5
        if: steps.pages.outcome == 'success' && steps.deploy.outcome == 'failure'
