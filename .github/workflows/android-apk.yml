# Builds the Android app (APK) on GitHub's own computers when started by hand (Actions → Android APK → Run workflow),
# and publishes it under Releases → "Latest" so it can be downloaded and installed on any Android phone.
# While testing on the laptop, code changes do not start a phone build.
name: Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: App icon
        run: pip install --quiet pillow && python3 scripts/make_icon.py
      - name: Install packages
        run: npm install --no-audit --no-fund && npx expo install --fix
      - name: Type check (report only)
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Make the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk ../AL-Swati.apk
      - name: Publish the download
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AL-Swati 1.0.${{ github.run_number }}
          body: 'Install on Android: open this page on the phone, tap AL-Swati.apk, then allow "install unknown apps" once.'
          files: AL-Swati.apk
          make_latest: true
