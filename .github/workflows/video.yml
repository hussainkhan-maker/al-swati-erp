# Videos on autopilot: renders the next video plan from Growth → Videos into an MP4 (video/render.py) and uploads it for review.
# Started by the Autopilot workflow when a plan is waiting (or by hand). The "video" function checks GitHub's signed token of
# this run, so only this workflow on main can take plans and upload videos. Nothing is posted from here: the owner approves first.
name: Video
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: video
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Tools (ffmpeg, Python packages, Chromium)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet numpy scipy pillow playwright==1.48.0
          python -m playwright install --with-deps chromium > /dev/null
      - name: Fonts (Google Fonts, open licence) and the logo
        working-directory: video
        run: |
          G=https://raw.githubusercontent.com/google/fonts/83c62e30d87daa70216dab6b984d00d20d96d585/ofl
          mkdir -p fonts
          for w in Medium Bold ExtraBold Black; do curl -fsSL -o fonts/Tajawal-$w.ttf $G/tajawal/Tajawal-$w.ttf; done
          curl -fsSL -o fonts/Montserrat.ttf "$G/montserrat/Montserrat%5Bwght%5D.ttf"
          curl -fsSL -o logo.png https://al-swaticontracting.com/images/logo/horizontal/dark.png
      - name: Render the next video and upload it for review
        run: python video/worker.py
